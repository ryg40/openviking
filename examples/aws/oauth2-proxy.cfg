# Inactive browser boundary. Read oauth2-proxy.md before use.
# Replace the tenant and client IDs with staging-specific values first.
provider = "oidc"
oidc_issuer_url = "https://login.microsoftonline.com/REPLACE_TENANT_ID/v2.0"
client_id = "REPLACE_BROWSER_CLIENT_ID"
redirect_url = "https://ov-browser.example.invalid/oauth2/callback"
scope = "openid profile email"

# Listen only on the application network. Shared ingress provides TLS.
http_address = "0.0.0.0:4180"
reverse_proxy = true
upstreams = ["http://openviking:1933/"]

# Entra assignment-required policy limits users in this single tenant.
# This wildcard does not provide an independent assignment check.
email_domains = ["*"]
skip_provider_button = true
skip_jwt_bearer_tokens = false

# Keep the cookie host-only. Use a different cookie name per environment.
cookie_name = "__Host-ov-browser-staging"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"

# Do not substitute an Entra token or a shared root key for native API keys.
pass_access_token = false
pass_authorization_header = false
set_authorization_header = false
pass_user_headers = false

# Runtime environment supplies the client secret and cookie secret.
# Do not add client_secret or cookie_secret values to this file.
request_logging = false
