# Inactive gateway example. Read nginx.md before use.
# Use an unprivileged image that includes ngx_http_auth_request_module.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Do not record URLs, cookies, authorization headers, or request bodies.
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    proxy_cache_path /tmp/cache keys_zone=unused:1m;

    # Reject unknown hostnames. Shared ingress terminates TLS.
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    # Browser requests always pass through the Entra OAuth proxy.
    server {
        listen 8080;
        server_name ov-browser.example.invalid;
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Remove identity claims supplied by an external client.
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Auth-Request-Email "";
            proxy_pass http://oauth2-proxy:4180;
        }
    }

    # Route this hostname through private DNS and approved private ingress.
    server {
        listen 8080;
        server_name ov-api.example.invalid;

        # An internal subrequest validates the native key with OpenViking.
        # Missing or invalid keys fail closed. No OAuth redirect occurs.
        location = /_native_auth {
            internal;
            proxy_pass http://openviking:1933/api/v1/system/status;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie "";
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header Authorization $http_authorization;
        }
        location / {
            auth_request /_native_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header Cookie "";
            # Preserve native Authorization and X-API-Key headers.
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://openviking:1933;
        }
    }
}
