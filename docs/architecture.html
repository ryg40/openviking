    close.addEventListener("click", function () { clearSelection(); if (S.returnFocus) S.returnFocus.focus(); });
    p.appendChild(h("div", { "class": "ph" }, [h("span", { "class": "dot" }), h("span", { "class": "gl", text: kind }), close]));
    p.appendChild(h("h2", { id: "p-title", text: title }));
    if (sub) p.appendChild(h("p", { "class": "psub", text: sub }));
    openPanel(hue);
    return p;
  }
  function section(p, title, body) {
    if (!body) return;
    p.appendChild(h("h3", { text: title }));
    p.appendChild(body);
  }
  function codes(list) {
    if (!list || !list.length) return null;
    return h("ul", { "class": "codes" }, list.map(function (x) { return h("li", null, [h("code", { text: x })]); }));
  }
  function linkButton(arrow, text, tag, onclick) {
    var b = h("button", { type: "button" }, [h("span", { "class": "arrow", "aria-hidden": "true", text: arrow }),
      h("span", { text: text }), tag ? h("span", { "class": "tag", text: tag }) : null]);
    b.addEventListener("click", onclick);
    return h("li", null, [b]);
  }
  function flowsWith(nodeId, view) {
    var hits = [];
    VIEWS.forEach(function (v) {
      if (v.type !== "flow" || v.base !== graphOf(view).id) return;
      v.flows.forEach(function (f) {
        f.steps.forEach(function (st, i) { if (st.node === nodeId) hits.push({ view: v, flow: f, step: i }); });
      });
    });
    return hits;
  }
  function showNode(view, n) {
    var g = graphOf(view);
    var p = head(GROUPS[n.group].label, hueOfGroup(n.group), n.label, n.sub);
    if (n.drill) {
      var b = h("button", { type: "button", "class": "primary", text: n.drill.label });
      b.addEventListener("click", function () { drill(n); });
      p.appendChild(h("div", { "class": "act" }, [b]));
    }
    section(p, "Summary", h("p", { text: n.summary }));
    if (n.value) section(p, M.meta.value_label, h("div", { "class": "value", text: n.value }));
    section(p, "Files", codes(n.files));
    section(p, "Configuration keys", codes(n.keys));
    var out = [], inc = [];
    g.edges.forEach(function (e, i) {
      var label = e.label || ET[e.type].label;
      if (e.from === n.id) out.push(linkButton("→", nodeOf(view, e.to).label, label, function () { selectEdge(i); }));
      if (e.to === n.id) inc.push(linkButton("←", nodeOf(view, e.from).label, label, function () { selectEdge(i); }));
    });
    if (out.length) section(p, "Outgoing edges (" + out.length + ")", h("ul", { "class": "links" }, out));
    if (inc.length) section(p, "Incoming edges (" + inc.length + ")", h("ul", { "class": "links" }, inc));
    var fl = flowsWith(n.id, view);
    if (fl.length) {
      section(p, "Data flows", h("ul", { "class": "links" }, fl.map(function (x) {
        return linkButton("▶", x.flow.title, "step " + (x.step + 1), function () {
          S.stack = view.type === "flow" ? S.stack : S.stack.concat([{ view: S.view, node: n.id, label: n.label }]);
          go(x.view.id, { flow: x.flow.id, step: x.step });
        });
      })));
    }
  }
  function showEdge(view, e, i) {
    var t = ET[e.type], from = nodeOf(view, e.from), to = nodeOf(view, e.to);
    var p = head(t.label, t.hue, from.label + " → " + to.label, e.label);
    section(p, "What passes over it", h("p", { text: e.detail || e.label || t.label }));
    if (e.checks && e.checks.length) {
      section(p, "Checks on this edge", h("ul", { "class": "codes checks" }, e.checks.map(function (c) {
        return h("li", null, [h("code", { text: c })]);
      })));
    }
    section(p, "Files", codes(e.files));
    section(p, "Configuration keys", codes(e.keys));
    section(p, "Ends", h("ul", { "class": "links" }, [
      linkButton("○", from.label, "source", function () { selectNode(from.id, { reveal: true }); }),
      linkButton("●", to.label, "target", function () { selectNode(to.id, { reveal: true }); })
    ]));
  }

  /* ---------- Data flows ---------- */
  function flowView() { for (var i = 0; i < VIEWS.length; i++) if (VIEWS[i].type === "flow") return VIEWS[i]; return null; }
  function currentFlow() {
    var fv = flowView();
    for (var i = 0; i < fv.flows.length; i++) if (fv.flows[i].id === S.flow.id) return fv.flows[i];
    return fv.flows[0];
  }
  function setFlow(id, step) {
    var fv = flowView();
    var f = fv.flows.filter(function (x) { return x.id === id; })[0] || fv.flows[0];
    S.flow = { id: f.id, step: clamp(step || 0, 0, f.steps.length - 1) };
    renderFlowbar();
    drawOverlay();
    if (S.view === fv.id) reveal(fv.id, f.steps[S.flow.step].node);
    writeHash();
  }
  function renderFlowbar() {
    var fv = flowView(), f = currentFlow(), tabs = $("flow-tabs"), ol = $("flow-steps");
    tabs.textContent = "";
    fv.flows.forEach(function (x) {
      var b = h("button", { type: "button", "aria-pressed": x.id === f.id ? "true" : "false", text: x.title });
      b.addEventListener("click", function () { setFlow(x.id, 0); });
      tabs.appendChild(b);
    });
    $("flow-sum").textContent = f.summary;
    ol.textContent = "";
    f.steps.forEach(function (st, i) {
      var n = nodeOf(fv, st.node);
      var b = h("button", { type: "button", "aria-current": i === S.flow.step ? "step" : null }, [
        h("span", { "class": "n", text: String(i + 1) }), h("span", { "class": "tt", text: st.title }),
        h("span", { "class": "nd", text: n.label }), h("span", { "class": "tx", text: st.text })]);
      b.addEventListener("click", function () { setFlow(f.id, i); });
      ol.appendChild(h("li", { "class": i < S.flow.step ? "done" : i === S.flow.step ? "cur" : "" }, [b]));
    });
    var cur = ol.children[S.flow.step];
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
    $("flow-count").textContent = "Step " + (S.flow.step + 1) + " of " + f.steps.length;
    $("flow-prev").disabled = S.flow.step === 0;
    $("flow-next").disabled = S.flow.step === f.steps.length - 1;
  }
  function drawOverlay() {
    var fv = flowView(), r = R[fv.id], L = r.L, f = currentFlow(), cur = S.flow.step, ol = r.overlay;
    ol.textContent = "";
    r.svg.classList.add("flowing");
    Object.keys(r.nodes).forEach(function (id) { r.nodes[id].classList.remove("inflow", "done", "cur"); });
    var numbers = {};
    f.steps.forEach(function (st, i) {
      (numbers[st.node] = numbers[st.node] || []).push(i);
      var ne = r.nodes[st.node];
      ne.classList.add("inflow");
      if (i < cur) ne.classList.add("done");
    });
    r.nodes[f.steps[cur].node].classList.add("cur");
    for (var i = 1; i < f.steps.length; i++) {
      var a = L.pos[f.steps[i - 1].node], b = L.pos[f.steps[i].node];
      if (a === b) continue;
      var sd = sides(a, b);
      var c = curve(anchor(a, sd[0], 0.5), sd[0], anchor(b, sd[1], 0.5), sd[1]);
      s("path", { "class": "fpath" + (i < cur ? " done" : i === cur ? " now" : ""), d: c.d, "marker-end": i <= cur ? "url(#m-flow)" : null }, ol);
      if (i === cur && f.steps[i].label) {
        var m = bez(c, 0.5), w = tw(f.steps[i].label, "600 11.5px " + FAM) + 16;
        var lg = s("g", { "class": "flabel" }, ol);
        s("rect", { x: m.x - w / 2, y: m.y - 11, width: w, height: 22, rx: 11 }, lg);
        s("text", { x: m.x - w / 2 + 8, y: m.y + 4, text: f.steps[i].label }, lg);
      }
    }
    Object.keys(numbers).forEach(function (id) {
      var p = L.pos[id], list = numbers[id], text = list.map(function (x) { return x + 1; }).join(" ");
      var w = Math.max(22, tw(text, "700 11px " + FAM) + 12);
      var done = list.some(function (x) { return x <= cur; });
      var bg = s("g", { "class": "badge" + (done ? "" : " todo") }, ol);
      s("rect", { x: p.x + p.w - w + 8, y: p.y - 11, width: w, height: 22, rx: 11 }, bg);
      s("text", { x: p.x + p.w - w + 8 + (w - tw(text, "700 11px " + FAM)) / 2, y: p.y + 4, text: text }, bg);
    });
  }
  function stepFlow(d) {
    var f = currentFlow();
    var n = clamp(S.flow.step + d, 0, f.steps.length - 1);
    if (n !== S.flow.step) setFlow(f.id, n);
  }

  /* ---------- Search ---------- */
  var INDEX = [];
  VIEWS.forEach(function (v) {
    if (v.type === "flow") return;
    v.nodes.forEach(function (n) {
      INDEX.push({ view: v.id, id: n.id, label: n.label, sub: n.sub || "",
        hay: [n.label, n.sub, n.summary, n.value, GROUPS[n.group].label].concat(n.files || [], n.keys || []).join("\n").toLowerCase() });
    });
  });
  var results = [], active = -1;
  function runSearch(q, quiet) {
    var terms = (q || "").toLowerCase().split(/\s+/).filter(Boolean);
    var r = R[S.view], g = graphOf(V[S.view]);
    results = !terms.length ? [] : INDEX.filter(function (x) {
      return terms.every(function (t) { return x.hay.indexOf(t) >= 0; });
    }).map(function (x) {
      var l = x.label.toLowerCase(), score = 0;
      terms.forEach(function (t) { if (l.indexOf(t) === 0) score += 4; else if (l.indexOf(t) >= 0) score += 2; });
      if (x.view === graphOf(V[S.view]).id) score += 1;
      return { x: x, score: score };
    }).sort(function (a, b) { return b.score - a.score; }).slice(0, 14).map(function (o) { return o.x; });
    r.svg.classList.toggle("searching", terms.length > 0);
    g.nodes.forEach(function (n) {
      var hit = results.some(function (x) { return x.view === g.id && x.id === n.id; }) ||
        (terms.length && INDEX.some(function (x) { return x.view === g.id && x.id === n.id && terms.every(function (t) { return x.hay.indexOf(t) >= 0; }); }));
      r.nodes[n.id].classList.toggle("match", !!hit);
    });
    if (!quiet) renderResults(terms.length > 0);
  }
  function renderResults(show) {
    var ul = $("results"), q = $("q");
    ul.textContent = "";
    active = results.length ? 0 : -1;
    if (!show) { ul.hidden = true; q.setAttribute("aria-expanded", "false"); q.removeAttribute("aria-activedescendant"); return; }
    if (!results.length) ul.appendChild(h("li", { "class": "empty", role: "option", "aria-disabled": "true", text: "No node matches." }));
    results.forEach(function (x, i) {
      var li = h("li", { role: "option", id: "res-" + i, "aria-selected": i === active ? "true" : "false" }, [
        h("span", { "class": "rl", text: x.label }), h("span", { "class": "rv", text: V[x.view].short || V[x.view].title })]);
      li.addEventListener("mousedown", function (ev) { ev.preventDefault(); pick(i); });
      ul.appendChild(li);
    });
    ul.hidden = false;
    q.setAttribute("aria-expanded", "true");
    if (active >= 0) q.setAttribute("aria-activedescendant", "res-" + active);
  }
  function moveActive(d) {
    if (!results.length) return;
    active = (active + d + results.length) % results.length;
    Array.prototype.forEach.call($("results").children, function (li, i) { li.setAttribute("aria-selected", i === active ? "true" : "false"); });
    $("q").setAttribute("aria-activedescendant", "res-" + active);
    var li = $("res-" + active);
    if (li && li.scrollIntoView) li.scrollIntoView({ block: "nearest" });
  }
  function pick(i) {
    var x = results[i];
    if (!x) return;
    $("results").hidden = true;
    $("q").setAttribute("aria-expanded", "false");
    S.stack = [];
    go(x.view, { node: x.id });
    var ne = R[x.view].nodes[x.id];
    if (ne) { S.returnFocus = ne; ne.focus({ preventScroll: true }); }
  }

  /* ---------- Guided tour ---------- */
  function showTour() {
    var st = M.tour[S.tour];
    Object.keys(R).forEach(function (id) {
      R[id].svg.querySelectorAll(".pulse").forEach(function (e) { e.classList.remove("pulse"); });
    });
    S.stack = [];
    go(st.view, { node: st.node, flow: st.flow, step: st.step });
    if (st.node) R[st.view].nodes[st.node].classList.add("pulse");
    $("tour").hidden = false;
    $("tour-count").textContent = "Tour stop " + (S.tour + 1) + " of " + M.tour.length;
    $("tour-title").textContent = st.title;
    $("tour-text").textContent = st.text;
    $("tour-prev").disabled = S.tour === 0;
    $("tour-next").textContent = S.tour === M.tour.length - 1 ? "Finish" : "Next";
    $("tour-next").focus();
  }
  function endTour() {
    if (S.tour === null) return;
    S.tour = null;
    $("tour").hidden = true;
    Object.keys(R).forEach(function (id) {
      R[id].svg.querySelectorAll(".pulse").forEach(function (e) { e.classList.remove("pulse"); });
    });
    $("tour-btn").focus();
  }

  /* ---------- Theme and URL state ---------- */
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function applyTheme() {
    var dark = S.theme === "dark" || (S.theme === "auto" && mq && mq.matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    $("theme-btn").textContent = "Theme: " + S.theme;
    $("theme-btn").setAttribute("aria-label", "Color theme: " + S.theme + ". Select to change.");
  }
  var lastHash = "";
  function writeHash() {
    if (!S.view) return;
    var parts = ["view=" + encodeURIComponent(S.view)];
    if (S.sel && S.sel.kind === "node") parts.push("node=" + encodeURIComponent(S.sel.id));
    if (V[S.view].type === "flow" && S.flow.id) parts.push("flow=" + encodeURIComponent(S.flow.id), "step=" + (S.flow.step + 1));
    if (hashTheme) parts.push("theme=" + hashTheme);
    var hash = "#" + parts.join("&");
    if (hash === location.hash) return;
    lastHash = hash;
    try { history.replaceState(null, "", hash); } catch (e) {
      try { location.replace(hash); } catch (e2) { /* the URL stays as it is */ }
    }
  }
  function readHash() {
    var out = {};
    location.hash.replace(/^#/, "").split("&").forEach(function (kv) {
      var i = kv.indexOf("=");
      if (i > 0) out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }
  var hashTheme = null;

  /* ---------- Start ---------- */
  function init() {
    $("title").textContent = M.meta.title;
    $("build").textContent = M.meta.build;
    $("note").textContent = M.meta.note;
    markers();
    VIEWS.forEach(function (v) { R[v.id] = renderView(v); });
    renderTabs();
    var st = readHash();
    try { S.theme = localStorage.getItem("ov-arch-theme") || "auto"; } catch (e) { S.theme = "auto"; }
    if (st.theme === "light" || st.theme === "dark") { S.theme = st.theme; hashTheme = st.theme; }
    applyTheme();
    if (mq && mq.addEventListener) mq.addEventListener("change", applyTheme);
    $("theme-btn").addEventListener("click", function () {
      S.theme = { auto: "light", light: "dark", dark: "auto" }[S.theme];
      hashTheme = null;
      try { localStorage.setItem("ov-arch-theme", S.theme); } catch (e) { /* no storage on this origin */ }
      applyTheme();
      writeHash();
    });
    $("labels-btn").addEventListener("click", function () {
      S.labels = !S.labels;
      this.setAttribute("aria-pressed", S.labels ? "true" : "false");
      Object.keys(R).forEach(function (id) { R[id].svg.classList.toggle("nolabels", !S.labels); });
    });
    $("fit-btn").addEventListener("click", function () { fitView(S.view); });
    $("zin-btn").addEventListener("click", function () { zoomCenter(1.25); });
    $("zout-btn").addEventListener("click", function () { zoomCenter(0.8); });
    $("flow-prev").addEventListener("click", function () { stepFlow(-1); });
    $("flow-next").addEventListener("click", function () { stepFlow(1); });
    $("tour-btn").addEventListener("click", function () { S.tour = 0; showTour(); });
    $("tour-next").addEventListener("click", function () {
      if (S.tour >= M.tour.length - 1) endTour(); else { S.tour++; showTour(); }
    });
    $("tour-prev").addEventListener("click", function () { if (S.tour > 0) { S.tour--; showTour(); } });
    $("tour-end").addEventListener("click", endTour);
    $("skip").addEventListener("click", function (ev) {
      ev.preventDefault();
      var first = R[S.view].svg.querySelector('.node[tabindex="0"]');
      if (first) first.focus();
    });
    var q = $("q");
    q.addEventListener("input", function () { runSearch(q.value); });
    q.addEventListener("focus", function () { if (q.value) runSearch(q.value); });
    q.addEventListener("blur", function () { setTimeout(function () { $("results").hidden = true; q.setAttribute("aria-expanded", "false"); }, 120); });
    q.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowDown") { ev.preventDefault(); moveActive(1); }
      else if (ev.key === "ArrowUp") { ev.preventDefault(); moveActive(-1); }
      else if (ev.key === "Enter") { ev.preventDefault(); pick(active < 0 ? 0 : active); }
    });
    document.addEventListener("keydown", function (ev) {
      var typing = ev.target.matches && ev.target.matches("input, textarea");
      if (ev.key === "/" && !typing) { ev.preventDefault(); q.focus(); q.select(); return; }
      if (ev.key === "Escape") {
        if (typing && (q.value || !$("results").hidden)) { q.value = ""; runSearch(""); return; }
        if (typing) { q.blur(); return; }
        if (S.tour !== null) { endTour(); return; }
        if (!$("panel").hidden) {
          var back = S.returnFocus;
          clearSelection();
          if (back && document.contains(back)) back.focus();
          return;
        }
        if (S.stack.length) back(S.stack.length - 1);
        return;
      }
      if (typing || ev.altKey || ev.ctrlKey || ev.metaKey) return;
      var inTabs = ev.target.closest && ev.target.closest("[role=tablist]");
      if (V[S.view].type === "flow" && !inTabs && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
        ev.preventDefault(); stepFlow(ev.key === "ArrowRight" ? 1 : -1); return;
      }
      if (ev.key === "+" || ev.key === "=") zoomCenter(1.25);
      else if (ev.key === "-") zoomCenter(0.8);
      else if (ev.key === "0") fitView(S.view);
    });
    window.addEventListener("resize", function () { if (!S.moved[S.view]) fitView(S.view); });
    window.addEventListener("hashchange", function () {
      if (location.hash === lastHash) return;
      var h2 = readHash();
      if (h2.view && V[h2.view]) { S.stack = []; go(h2.view, { node: h2.node, flow: h2.flow, step: (+h2.step || 1) - 1 }); }
    });
    go(st.view, { node: st.node, flow: st.flow, step: (+st.step || 1) - 1 });
    if (st.tour === "1") { S.tour = 0; showTour(); }
    document.documentElement.setAttribute("data-ready", "true");
  }
  init();
})();
</script>
</body>
</html>
