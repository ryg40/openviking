    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    $("theme-btn").textContent = "Theme: " + S.theme;
    $("theme-btn").setAttribute("aria-label", "Color theme: " + S.theme + ". Select to change.");
  }
  var lastHash = "";
  function writeHash() {
    if (!S.view) return;
    var parts = ["view=" + encodeURIComponent(S.view)];
    if (S.sel && S.sel.kind === "node") parts.push("node=" + encodeURIComponent(S.sel.id));
    if (V[S.view].type === "flow" && S.flow.id) parts.push("flow=" + encodeURIComponent(S.flow.id), "step=" + (S.flow.step + 1));
    if (hashTheme) parts.push("theme=" + hashTheme);
    var hash = "#" + parts.join("&");
    if (hash === location.hash) return;
    lastHash = hash;
    try { history.replaceState(null, "", hash); } catch (e) {
      try { location.replace(hash); } catch (e2) { /* the URL stays as it is */ }
    }
  }
  function readHash() {
    var out = {};
    location.hash.replace(/^#/, "").split("&").forEach(function (kv) {
      var i = kv.indexOf("=");
      if (i > 0) out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }
  var hashTheme = null;

  /* ---------- Start ---------- */
  function init() {
    $("title").textContent = M.meta.title;
    $("build").textContent = M.meta.build;
    $("note").textContent = M.meta.note;
    markers();
    VIEWS.forEach(function (v) { R[v.id] = renderView(v); });
    renderTabs();
    var st = readHash();
    try { S.theme = localStorage.getItem("ov-arch-theme") || "auto"; } catch (e) { S.theme = "auto"; }
    if (st.theme === "light" || st.theme === "dark") { S.theme = st.theme; hashTheme = st.theme; }
    applyTheme();
    if (mq && mq.addEventListener) mq.addEventListener("change", applyTheme);
    $("theme-btn").addEventListener("click", function () {
      S.theme = { auto: "light", light: "dark", dark: "auto" }[S.theme];
      hashTheme = null;
      try { localStorage.setItem("ov-arch-theme", S.theme); } catch (e) { /* no storage on this origin */ }
      applyTheme();
      writeHash();
    });
    $("labels-btn").addEventListener("click", function () {
      S.labels = !S.labels;
      this.setAttribute("aria-pressed", S.labels ? "true" : "false");
      Object.keys(R).forEach(function (id) { R[id].svg.classList.toggle("nolabels", !S.labels); });
    });
    $("fit-btn").addEventListener("click", function () { fitView(S.view); });
    $("zin-btn").addEventListener("click", function () { zoomCenter(1.25); });
    $("zout-btn").addEventListener("click", function () { zoomCenter(0.8); });
    $("flow-prev").addEventListener("click", function () { stepFlow(-1); });
    $("flow-next").addEventListener("click", function () { stepFlow(1); });
    $("tour-btn").addEventListener("click", function () { S.tour = 0; showTour(); });
    $("tour-next").addEventListener("click", function () {
      if (S.tour >= M.tour.length - 1) endTour(); else { S.tour++; showTour(); }
    });
    $("tour-prev").addEventListener("click", function () { if (S.tour > 0) { S.tour--; showTour(); } });
    $("tour-end").addEventListener("click", endTour);
    $("skip").addEventListener("click", function (ev) {
      ev.preventDefault();
      var first = R[S.view].svg.querySelector('.node[tabindex="0"]');
      if (first) first.focus();
    });
    var q = $("q");
    q.addEventListener("input", function () { runSearch(q.value); });
    q.addEventListener("focus", function () { if (q.value) runSearch(q.value); });
    q.addEventListener("blur", function () { setTimeout(function () { $("results").hidden = true; q.setAttribute("aria-expanded", "false"); }, 120); });
    q.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowDown") { ev.preventDefault(); moveActive(1); }
      else if (ev.key === "ArrowUp") { ev.preventDefault(); moveActive(-1); }
      else if (ev.key === "Enter") { ev.preventDefault(); pick(active < 0 ? 0 : active); }
    });
    document.addEventListener("keydown", function (ev) {
      var typing = ev.target.matches && ev.target.matches("input, textarea");
      if (ev.key === "/" && !typing) { ev.preventDefault(); q.focus(); q.select(); return; }
      if (ev.key === "Escape") {
        if (typing && (q.value || !$("results").hidden)) { q.value = ""; runSearch(""); return; }
        if (typing) { q.blur(); return; }
        if (S.tour !== null) { endTour(); return; }
        if (!$("panel").hidden) {
          var back = S.returnFocus;
          clearSelection();
          if (back && document.contains(back)) back.focus();
          return;
        }
        if (S.stack.length) back(S.stack.length - 1);
        return;
      }
      if (typing || ev.altKey || ev.ctrlKey || ev.metaKey) return;
      var inTabs = ev.target.closest && ev.target.closest("[role=tablist]");
      if (V[S.view].type === "flow" && !inTabs && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
        ev.preventDefault(); stepFlow(ev.key === "ArrowRight" ? 1 : -1); return;
      }
      if (ev.key === "+" || ev.key === "=") zoomCenter(1.25);
      else if (ev.key === "-") zoomCenter(0.8);
      else if (ev.key === "0") fitView(S.view);
    });
    window.addEventListener("resize", function () { if (!S.moved[S.view]) fitView(S.view); });
    window.addEventListener("hashchange", function () {
      if (location.hash === lastHash) return;
      var h2 = readHash();
      if (h2.view && V[h2.view]) { S.stack = []; go(h2.view, { node: h2.node, flow: h2.flow, step: (+h2.step || 1) - 1 }); }
    });
    go(st.view, { node: st.node, flow: st.flow, step: (+st.step || 1) - 1 });
    if (st.tour === "1") { S.tour = 0; showTour(); }
    document.documentElement.setAttribute("data-ready", "true");
  }
  init();
})();
</script>
</body>
</html>
